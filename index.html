<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>DJ Hands — Play chords in the air with your webcam</title>
    <meta
      name="description"
      content="DJ Hands turns your webcam into an instrument. Your left hand picks the chord, your right hand picks the sound, and its height sets the volume. Runs entirely in your browser — no video ever leaves your device."
    />
    <link rel="canonical" href="https://www.dj-hands.com/" />
    <meta name="author" content="Yusif Aliyev" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="DJ Hands" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DJ Hands" />
    <meta property="og:url" content="https://www.dj-hands.com/" />
    <meta property="og:title" content="DJ Hands — Play chords in the air" />
    <meta
      property="og:description"
      content="Your webcam is the instrument. Left hand picks the chord, right hand picks the sound. Runs entirely in your browser."
    />
    <meta property="og:image" content="https://www.dj-hands.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DJ Hands — play chords in the air. Your webcam is the instrument." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DJ Hands — Play chords in the air" />
    <meta
      name="twitter:description"
      content="Your webcam is the instrument. Left hand picks the chord, right hand picks the sound. Runs entirely in your browser."
    />
    <meta name="twitter:image" content="https://www.dj-hands.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DJ Hands",
        "url": "https://www.dj-hands.com/",
        "description": "Play chords in the air using hand gestures tracked through your webcam. Vision and audio run entirely in the browser.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any browser with a webcam",
        "browserRequirements": "Requires a modern browser with WebGL and webcam access",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Yusif Aliyev",
          "url": "https://www.linkedin.com/in/yusif-programmer/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Buy Me a Coffee floating widget — injects its own button and modal.
         data-position must be lowercase: the script compares it to "left" verbatim. -->
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="dj.hands"
      data-description="Support me on Buy me a coffee!"
      data-message="You can support this project by Buying a Coffee 😄"
      data-color="#FFDD00"
      data-position="left"
      data-x_margin="18"
      data-y_margin="18"
    ></script>
  </body>
</html>
