name: Build
description: Install, check and build the app — the one recipe every workflow runs.

# A composite action rather than a reusable workflow: these steps run inside the
# caller's job, so `dist/` is still there afterwards. deploy.yml uploads it as a
# Pages artifact and release.yml zips it; a reusable workflow would run in its own
# job and force both through an artifact round-trip for nothing.
#
# Checkout stays with the caller — deploy.yml checks out a chosen `ref`, and other
# workflows need their own fetch depth.

inputs:
  node-version:
    description: Node version to build with
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # `prebuild` fetches a 7.5MB hand-tracking model from Google and skips the
    # download when the file is already there. Keyed on the script because the
    # model URL is a constant inside it, so changing the URL misses the cache.
    # public/wasm is deliberately not cached: it is copied out of node_modules,
    # costs no network, and is copied on every run anyway.
    - uses: actions/cache@v4
      with:
        path: public/models
        key: model-${{ runner.os }}-${{ hashFiles('scripts/fetch-assets.mjs') }}

    - run: npm ci
      shell: bash

    - run: npm run lint
      shell: bash

    # Cheap ahead of the build: it writes the buildinfo that `npm run build`'s own
    # `tsc -b` then reads, so the type pass runs once and fails on its own line.
    - run: npm run typecheck
      shell: bash

    # prebuild vendors the MediaPipe model + wasm runtime into public/,
    # postbuild prerenders the start screen into dist/index.html
    - run: npm run build
      shell: bash

    - run: npm test
      shell: bash
