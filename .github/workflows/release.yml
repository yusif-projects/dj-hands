name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install, lint, typecheck, build, test — see .github/actions/build
      - uses: ./.github/actions/build
      - name: Archive the built bundle
        run: zip -r "dj-hands-${GITHUB_REF_NAME}.zip" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "dj-hands-${GITHUB_REF_NAME}.zip"
